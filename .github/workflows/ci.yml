name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-hotspot-jdk-ci:
    name: Test CI - JDK ${{ matrix.java-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 集成测试要拉取较大的镜像（nacos/seata/mysql/postgres/consul），冷缓存时多留一些时间。
    timeout-minutes: 120
    strategy:
      matrix:
        os: [ 'ubuntu-latest' ]
        java-version: [ '17', '21' ]
    steps:
      - uses: actions/checkout@v3
      - name: Setup java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'maven'
      - name: Build all test with Maven
        run: |
          ./mvnw -T1C -e clean test
  test-minimum-hotspot-jdk-ci:
    name: Test CI - JDK ${{ matrix.java-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ 'ubuntu-latest' ]
        java-version: [ '8' ]
    steps:
      - uses: actions/checkout@v3
      - name: Setup java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'maven'
      - name: Build spring-boot-2 samples with Maven
        # 主代码保持 Java 8 兼容；测试需要 testcontainers 2.x（加载要求 Java 17+），
        # 因此 JDK 8 任务只做编译验证，测试在上面的 JDK 17/21 任务中执行。
        run: |
          ./mvnw -am -pl spring-boot-2/shardingsphere-jdbc-4.x-spring-sample -T1C -B -e clean compile
