name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-hotspot-jdk-ci:
    name: Test CI - JDK ${{ matrix.java-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ 'ubuntu-latest' ]
        java-version: [ '17', '21', '25', '27' ]
    steps:
      - uses: actions/checkout@v7
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'maven'
      - name: Build all test with Maven
        run: |
          ./mvnw -T1C -e clean test
  test-minimum-hotspot-jdk-ci:
    name: Test CI - JDK ${{ matrix.java-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ 'ubuntu-latest' ]
        java-version: [ '8' ]
    steps:
      - uses: actions/checkout@v7
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'maven'
      - name: Build spring-boot-2 samples with Maven
        run: |
          ./mvnw -am -pl spring-boot-2/shardingsphere-jdbc-4.x-spring-sample,spring-boot-2/shardingsphere-jdbc-5.x-spring-sample -T1C -B -e clean test
  lint-format-ci:
    name: Lint & Format CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          # Checkstyle 14 与 google-java-format 1.30+ 都要求 JDK 21+。
          java-version: '21'
          cache: 'maven'
      - name: Check format with Spotless
        run: ./mvnw -B -e spotless:check
      - name: Check lint with Checkstyle
        run: ./mvnw -B -e checkstyle:check
