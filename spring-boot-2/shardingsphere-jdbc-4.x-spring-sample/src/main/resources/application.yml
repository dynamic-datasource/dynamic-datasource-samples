spring:
  shardingsphere:
    datasource:
      names: shardingmaster,shardingslave0,shardingslave1
      shardingmaster:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
        jdbc-url: jdbc:tc:mysql:8://test_hostname/master?TC_INITSCRIPT=db/schema.sql
        username: test
        password: test
      shardingslave0:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
        jdbc-url: jdbc:tc:mysql:8://test_hostname/slave1?TC_INITSCRIPT=db/schema.sql
        username: test
        password: test
      shardingslave1:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
        jdbc-url: jdbc:tc:mysql:8://test_hostname/slave2?TC_INITSCRIPT=db/schema.sql
        username: test
        password: test
    sharding:
      tables:
        t_order:
          actualDataNodes: shardingmaster.t_order$->{0..1}
          tableStrategy:
            inline:
              shardingColumn: order_id
              algorithmExpression: t_order$->{order_id % 2}
          keyGenerator:
            type: SNOWFLAKE
            column: order_id
    props:
      sql:
        show: true
  # dynamic-datasource 配置
  datasource:
    dynamic:
      datasource:
        master:
          username: sa
          password: ""
          url: jdbc:h2:mem:baomidou_master;INIT=RUNSCRIPT FROM 'classpath:db/schema.sql'
          driver-class-name: org.h2.Driver
        test:
          username: sa
          password: ""
          url: jdbc:h2:mem:baomidou_test;INIT=RUNSCRIPT FROM 'classpath:db/schema.sql'
          driver-class-name: org.h2.Driver
logging:
  level:
    com.baomidou: debug
