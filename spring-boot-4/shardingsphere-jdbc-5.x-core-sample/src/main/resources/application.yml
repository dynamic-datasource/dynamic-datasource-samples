spring:
  # dynamic-datasource 配置
  datasource:
    dynamic:
      datasource:
        master:
          driver-class-name: org.h2.Driver
          url: jdbc:h2:mem:baomidou_master;INIT=RUNSCRIPT FROM 'classpath:db/schema.sql'
          username: sa
          password: ""
        test:
          driver-class-name: org.h2.Driver
          url: jdbc:h2:mem:baomidou_test;INIT=RUNSCRIPT FROM 'classpath:db/schema.sql'
          username: sa
          password: ""
        shardingSphere:
          driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
          # 使用 system_props 占位符解析 config.yaml，默认值即 testcontainers-java 的 `jdbc:tc:` 数据源；
          # native 测试通过系统属性切换到符合 native 限制的 config-native.yaml。
          url: jdbc:shardingsphere:classpath:${sample.shardingsphere.config:config.yaml}?placeholder-type=system_props
logging:
  level:
    com.baomidou: debug
