dataSources:
  # 数据源配置使用 ShardingSphere YAML 的动态占位符（配合 jdbc:shardingsphere 的
  # `?placeholder-type=system_props`）：默认值保持 testcontainers-java 的 `jdbc:tc:` 数据源，
  # 无 host 的 URL 在 testcontainers 2.0.0+ 可正确解析库名（testcontainers#4121 已修复），
  # GraalVM native image 测试下（见 testcontainers/testcontainers-java#7954）通过系统属性覆盖为
  # 普通 MySQL 驱动与地址。
  shardingmaster:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: $${sample.shardingsphere.driver::org.testcontainers.jdbc.ContainerDatabaseDriver}
    jdbcUrl: $${sample.shardingsphere.master-url::jdbc:tc:mysql:26.7.0-oraclelinux9:///master?TC_INITSCRIPT=db/schema.sql}
    username: $${sample.shardingsphere.username::test}
    password: $${sample.shardingsphere.password::test}
  shardingslave0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: $${sample.shardingsphere.driver::org.testcontainers.jdbc.ContainerDatabaseDriver}
    jdbcUrl: $${sample.shardingsphere.slave0-url::jdbc:tc:mysql:26.7.0-oraclelinux9:///slave1?TC_INITSCRIPT=db/schema.sql}
    username: $${sample.shardingsphere.username::test}
    password: $${sample.shardingsphere.password::test}
  shardingslave1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: $${sample.shardingsphere.driver::org.testcontainers.jdbc.ContainerDatabaseDriver}
    jdbcUrl: $${sample.shardingsphere.slave1-url::jdbc:tc:mysql:26.7.0-oraclelinux9:///slave2?TC_INITSCRIPT=db/schema.sql}
    username: $${sample.shardingsphere.username::test}
    password: $${sample.shardingsphere.password::test}
rules:
- !SHARDING
  tables:
    t_order:
      actualDataNodes: shardingmaster.t_order$->{0..1}
      tableStrategy:
        standard:
          shardingColumn: order_id
          shardingAlgorithmName: baomidou_inline
      keyGenerateStrategy:
        column: order_id
        keyGeneratorName: baomidou_snowflake
  shardingAlgorithms:
    baomidou_inline:
      type: INLINE
      props:
        algorithm-expression: t_order$->{order_id % 2}
        allow-range-query-with-inline-sharding: true
  keyGenerators:
    baomidou_snowflake:
      type: SNOWFLAKE
- !READWRITE_SPLITTING
  dataSourceGroups:
    baomidou_readwrite_data_sources:
      writeDataSourceName: shardingmaster
      readDataSourceNames:
        - shardingslave0
        - shardingslave1
      loadBalancerName: baomidou_load_balance_algorithm
  loadBalancers:
    baomidou_load_balance_algorithm:
      type: ROUND_ROBIN
- !SINGLE
  tables:
    - "*.*"
props:
  sql-show: true
